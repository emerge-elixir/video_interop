[package]
name = "video-interop"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
description = "Video frame, DMA-BUF, synchronization, and ownership types for Rust and Elixir"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/emerge-elixir/video_interop"
documentation = "https://docs.rs/video-interop"
keywords = ["video", "dmabuf", "drm", "rustler", "interop"]
categories = ["api-bindings", "multimedia::video"]

[lib]
name = "video_interop"
path = "src/lib.rs"

[features]
default = ["rustler"]
egl = []
rustler = ["dep:rustler"]
test-support = ["rustler"]
vulkan = ["dep:ash"]

[dependencies]
ash = { version = "0.38", default-features = false, features = ["std"], optional = true }
libc = "0.2"
rustler = { version = "0.38", optional = true }
thiserror = "2"

[package.metadata.docs.rs]
all-features = true
